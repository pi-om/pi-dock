<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dockyard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<div id="app">

  <!-- ── Sidebar Panel (white) ────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Dockyard</div>
      <div class="sidebar-sub">Local Manager</div>
    </div>

    <nav class="sidebar-nav">

      <div class="nav-item" data-nav="dashboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </div>

      <div class="nav-item" data-nav="images">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Images
      </div>

      <div class="nav-item" data-nav="stacks">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        Stacks
      </div>

    </nav>

    <div class="sidebar-footer">
      <div class="nav-item" style="cursor:default;color:var(--text-dim);font-size:12px;pointer-events:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        v1.0.0
      </div>
    </div>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────────────────── -->
  <div class="main">
    <div class="topbar">
      <div id="topbar-content" style="display:flex;align-items:center;gap:8px">
        <span class="topbar-title">Dockyard</span>
      </div>
    </div>

    <div class="page-body" id="page-body">
      <div class="loading-state"><div class="spinner"></div>Loading…</div>
    </div>
  </div>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
